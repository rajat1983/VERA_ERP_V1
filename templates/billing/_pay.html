{% if can_pay and razorpay_ready and plans %}
<form id="veraPayForm" class="mt-3">
  <label class="form-label" for="pay_plan_id">Pay for a plan</label>
  <div class="d-flex flex-wrap gap-2">
    <select class="form-select" id="pay_plan_id" name="plan_id" style="max-width: 18rem;">
      {% for plan in plans %}
      <option value="{{ plan.id }}">{{ plan.name }} · {{ format_price(plan.price_paise) }} + GST</option>
      {% endfor %}
    </select>
    <button class="btn btn-primary" type="submit">Pay with Razorpay</button>
  </div>
  <div class="form-text" id="veraPayError"></div>
</form>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(function () {
  const form = document.getElementById("veraPayForm");
  if (!form) return;
  const csrf = document.querySelector('meta[name="csrf-token"]').getAttribute("content");
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const err = document.getElementById("veraPayError");
    err.textContent = "";
    const planId = document.getElementById("pay_plan_id").value;
    const res = await fetch("{{ url_for('billing.create_order') }}", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRF-Token": csrf},
      body: JSON.stringify({plan_id: planId, csrf_token: csrf})
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || "Could not start payment.";
      return;
    }
    const rzp = new Razorpay({
      key: data.key_id,
      amount: data.amount,
      currency: data.currency,
      name: "VERA ERP",
      description: data.plan_name,
      order_id: data.order_id,
      handler: async function (response) {
        const verify = await fetch("{{ url_for('billing.verify') }}", {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-CSRF-Token": csrf},
          body: JSON.stringify(Object.assign({plan_id: planId, csrf_token: csrf}, response))
        });
        const result = await verify.json();
        if (!verify.ok) {
          err.textContent = result.error || "Payment could not be confirmed.";
          return;
        }
        window.location.href = "{{ url_for('billing.home') }}";
      }
    });
    rzp.open();
  });
})();
</script>
{% elif can_pay %}
<p class="text-muted mt-3 mb-0">Online payment is not configured. Super Admin can add Razorpay keys or activate the plan from the platform.</p>
{% endif %}
