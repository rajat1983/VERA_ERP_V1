{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">

<form method="POST"
      enctype="multipart/form-data"
      class="needs-validation"
      novalidate>

<div class="card shadow">

    <!-- Header -->

    <div class="card-header bg-primary text-white">

        <div class="d-flex justify-content-between align-items-center">

            <h4 class="mb-0">

                <i class="bi bi-plus-circle"></i>

                Add Product

            </h4>

            <span class="badge bg-light text-dark">

                Product Code :
                {{ product_code }}

            </span>

        </div>

    </div>

    <div class="card-body">

        <div class="row">

            <!-- ========================= -->
            <!-- Left Panel -->
            <!-- ========================= -->

            <div class="col-lg-4">

                <div class="card border">

                    <div class="card-header bg-light">

                        <strong>

                            <i class="bi bi-image"></i>

                            Product Image

                        </strong>

                    </div>

                    <div class="card-body text-center">

                        <div
                            id="previewImage"
                            class="product-placeholder-large mb-3">

                            <i class="bi bi-box-seam"></i>

                            <div class="mt-2">

                                No Product Image

                            </div>

                        </div>

                        <input    type="file"    id="image"    name="image"    class="form-control"    accept=".jpg,.jpeg,.png,.webp">

                        <small class="text-muted">

                            JPG / PNG / WEBP

                        </small>

                    </div>

                </div>

            </div>

            <!-- ========================= -->
            <!-- Right Panel -->
            <!-- ========================= -->

            <div class="col-lg-8">

                <div class="card border">

                    <div class="card-header bg-light">

                        <strong>

                            <i class="bi bi-info-circle"></i>

                            Basic Information

                        </strong>

                    </div>

                    <div class="card-body">

                        <div class="row">

                            <!-- Vendor -->

                            <div class="col-md-6 mb-3 position-relative">

                                <label class="form-label">

                                    Vendor

                                </label>

                                <input
                                    type="text"
                                    id="vendor_input"
                                    class="form-control"
                                    autocomplete="off"
                                    placeholder="Search Vendor">

                                <input
                                    type="hidden"
                                    name="vendor_id"
                                    id="vendor_id">

                                <div
                                    id="vendor_suggestions"
                                    class="list-group mt-1">

                                </div>

                            </div>

                            <!-- Status -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select
                                    name="status"
                                    class="form-select">

                                    <option value="active">

                                        Active

                                    </option>

                                    <option value="inactive">

                                        Inactive

                                    </option>

                                </select>

                            </div>

                            <!-- Product Name -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Product Name

                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    required>

                            </div>

                            <!-- Product Code -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Product Code

                                </label>

                                <input
                                    type="text"
                                    name="sku"
                                    class="form-control"
                                    value="{{ product_code }}"
                                    readonly>

                            </div>
						                            <!-- ========================= -->
                            <!-- Pricing Information -->
                            <!-- ========================= -->

                            <div class="col-12">

                                <hr>

                                <h5 class="text-primary mb-3">

                                    <i class="bi bi-cash-stack"></i>

                                    Pricing Information

                                </h5>

                            </div>

                            <!-- Purchase Price -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Purchase Price

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        ₹

                                    </span>

  <input    type="number" step="0.01" min="0" name="cost_price"  id="cost_price"  class="form-control"  required>

                                </div>

                            </div>

                            <!-- Selling Price -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Selling Price

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        ₹

                                    </span>

                                    <input
                                        type="number"
                                        step="0.01"
                                        min="0"
                                        name="selling_price"
                                        id="selling_price"
                                        class="form-control"                                      
                                        required>

                                </div>

                            </div>

                            <!-- Profit -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Expected Profit

                                </label>

                                <input
                                    type="text"
                                    id="profit_margin"
                                    class="form-control bg-light"
                                    readonly>

                            </div>

                            <!-- ========================= -->
                            <!-- Inventory -->
                            <!-- ========================= -->

                            <div class="col-12">

                                <hr>

                                <h5 class="text-primary mb-3">

                                    <i class="bi bi-boxes"></i>

                                    Inventory Information

                                </h5>

                            </div>

                            <!-- Quantity -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Opening Stock

                                </label>

                                <input
                                    type="number"
                                    min="0"
                                    name="stock_qty"
                                    id="stock_qty"
                                    class="form-control"
                                    value="0"
                                    required>

                            </div>

                            <!-- Reorder -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Reorder Level

                                </label>

                                <input  type="number"  min="0" name="reorder_level"  id="reorder_level" class="form-control" value="5">

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <div class="card-footer">

        <div class="d-flex justify-content-between">

            <a href="/products"

               class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left"></i>

                Back

            </a>

            <button
    type="button"
    id="btnSaveProduct"
    class="btn btn-success">

    <i class="bi bi-check-circle"></i>

    Save Product

</button>
              

        </div>

    </div>

</div>

</form>

</div>
<div   class="modal fade"  id="priceWarningModal"  tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-warning">

                <h5 class="modal-title">

                    <i class="bi bi-exclamation-triangle-fill"></i>

                    Price Warning

                </h5>

            </div>

            <div class="modal-body"> Selling Price is lower than Purchase Price.   <br><br>            
            </div>

            <div class="modal-footer">

                <button   type="button"  class="btn btn-secondary"  data-bs-dismiss="modal"> Ok </button>

                

            </div>

        </div>

    </div>

</div>


{% endblock %}
