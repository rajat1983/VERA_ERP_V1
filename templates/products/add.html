{% extends "base.html" %}
{% block content %}
<h3>Add Product</h3>

<style>
#vendor_suggestions {
  position:absolute;
  z-index:9999;
  width:70%;
}
</style>
<form method="post" enctype="multipart/form-data">
  <label>Vendor</label>
<input type="text" id="vendor_input" class="form-control" autocomplete="off">
<input type="hidden" name="vendor_id" id="vendor_id">

<div id="vendor_suggestions" class="list-group mt-1"></div>
 
Name:<input name="name" class="form-control" required>

<label>Product Code(SKU)</label>

<input type="text"  name="sku" class="form-control"  value="{{ product_code }}"  readonly>
<div class="mb-3">

    <label class="form-label">       Product Image    </label>
    <input  type="file"   name="image"  class="form-control"  accept=".jpg,.jpeg,.png,.webp"   >
    <small class="text-muted"> Supported: JPG, PNG, WEBP (Max 2 MB)   </small>
</div>

Cost Price:<input name="cost_price" class="form-control" required>

Selling Price:<input name="selling_price" class="form-control" required>

Quantity:<input name="stock_qty" class="form-control" required>

Reorder Level:<input name="reorder_level" class="form-control" value="0">

Status:<select name="status" class="form-control">
  <option value="active">Active</option>
  <option value="inactive">Inactive</option>
</select>

<button class="btn btn-primary mt-2">Save</button>
<a href="/products" class="btn btn-secondary" >Cancel</a>

</form>
<script>
const input = document.getElementById("vendor_input");
const hidden = document.getElementById("vendor_id");
const listBox = document.getElementById("vendor_suggestions");

let selected = false;

document.querySelector("form").addEventListener("submit", function(e){
  if(!hidden.value){
    e.preventDefault();
    alert("Please select or add a vendor");
  }
});

input.addEventListener("keyup", async function(){
  selected = false;
  hidden.value = "";
  const q = this.value.trim();
  listBox.innerHTML = "";

  if(!q) return;

  const res = await fetch(`/api/vendors/search?q=${encodeURIComponent(q)}`);
  const vendors = await res.json();

  if(vendors.length){
    vendors.forEach(v => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "list-group-item list-group-item-action";
      btn.innerText = v.name;

      btn.onclick = function(){
        input.value = v.name;
        hidden.value = v.id;
        listBox.innerHTML = "";
        selected = true;
      };

      listBox.appendChild(btn);
    });
  } else {
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "list-group-item list-group-item-action text-success";
    addBtn.innerText = `Add new vendor "${q}"`;

    addBtn.onclick = async function(){
      if(!confirm("Create new vendor?")) return;

      try {
        const res = await fetch("/api/vendors/add", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ name: q })
        });

        const data = await res.json();

        input.value = data.name;
        hidden.value = data.id;
        listBox.innerHTML = "";
        selected = true;

      } catch(err){
        alert("Network error");
        console.error(err);
      }
    };

    listBox.appendChild(addBtn);
  }
});
</script>




{% endblock %}
