{% extends "auth/layout.html" %}
{% block content %}
<h1 class="h4 mb-1">VERA Platform</h1>
<p class="text-muted mb-4">Super Admin sign in</p>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
<p class="text-muted small mt-3 mb-0">
  Shop users should use <a href="{{ url_for('auth.login') }}">shop sign in</a>.
</p>
{% endblock %}
