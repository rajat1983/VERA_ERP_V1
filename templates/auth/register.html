{% extends "auth/layout.html" %}
{% block content %}
<h1 class="h4 mb-1">Create an account</h1>
<p class="text-muted mb-4">Registration stays pending until an admin approves it.</p>
<form method="POST" autocomplete="off" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="full_name">Name</label>
    <input class="form-control" id="full_name" name="full_name" value="{{ form.full_name }}" required maxlength="120">
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" type="email" name="email" value="{{ form.email }}" required maxlength="120">
  </div>
  <div class="mb-3">
    <label class="form-label" for="mobile">Mobile number</label>
    <input class="form-control" id="mobile" name="mobile" value="{{ form.mobile }}" maxlength="20" inputmode="tel">
  </div>
  <div class="mb-3">
    <label class="form-label" for="photo">Profile photo</label>
    <input class="form-control" id="photo" type="file" name="photo" accept=".jpg,.jpeg,.png,.webp">
  </div>
  <div class="mb-3">
    <label class="form-label" for="shop_code">Shop code</label>
    <input class="form-control" id="shop_code" name="shop_code" value="{{ form.shop_code }}" required maxlength="16" placeholder="SHOP0001">
  </div>
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input class="form-control" id="username" name="username" value="{{ form.username }}" required maxlength="80" autocomplete="username">
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" type="password" name="password" required minlength="6" autocomplete="new-password">
  </div>
  <div class="mb-3">
    <label class="form-label" for="confirm_password">Confirm password</label>
    <input class="form-control" id="confirm_password" type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
  </div>
  <button class="btn btn-primary w-100" type="submit">Register</button>
</form>
<p class="text-muted small mt-3 mb-0">
  Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
</p>
{% endblock %}
