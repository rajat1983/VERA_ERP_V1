{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                <i class="bi bi-truck"></i>

                Add Vendor

            </h4>

        </div>

        <div class="card-body">

            <form
                method="POST"
                id="vendorForm"
                data-mode="add"                
                onsubmit="confirmVendorSubmit(event)">

                <div class="row">

                    <!-- Vendor Code -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            Vendor Code

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vendor_code }}"
                            readonly>

                    </div>

                    <!-- Vendor Name -->

                    <div class="col-md-8 mb-3">

                        <label class="form-label fw-bold">

                            Vendor Name
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ request.form.get('name','') }}"
                            required>

                    </div>

                </div>

                <div class="row">
                                        <!-- Mobile Number -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            Mobile Number
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            type="text"
                            name="phone"
                            maxlength="10"
                            class="form-control"
                            value="{{ request.form.get('phone','') }}"
                            required>

                    </div>

                    <!-- Email -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ request.form.get('email','') }}">

                    </div>

                    <!-- GST Number -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            GST Number

                        </label>

                        <input
                            type="text"
                            name="gst_number"
                            maxlength="15"
                            class="form-control text-uppercase"
                            value="{{ request.form.get('gst_number','') }}">

                    </div>

                </div>

                <div class="row">
                                        <!-- City -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            City

                        </label>

                        <input
                            type="text"
                            name="city"
                            class="form-control"
                            value="{{ request.form.get('city','') }}">

                    </div>

                    <!-- State -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            State

                        </label>

                        <input
                            type="text"
                            name="state"
                            class="form-control"
                            value="{{ request.form.get('state','') }}">

                    </div>

                    <!-- PIN Code -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            PIN Code

                        </label>

                        <input
                            type="text"
                            name="pincode"
                            maxlength="6"
                            class="form-control"
                            value="{{ request.form.get('pincode','') }}">

                    </div>

                </div>

                <!-- Address -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Address

                    </label>

                    <textarea
                        name="address"
                        rows="4"
                        class="form-control">{{ request.form.get('address','') }}</textarea>

                </div>

                <div class="row">

                    <!-- Status -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">

                            Status

                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Active" selected>

                                Active

                            </option>

                            <option value="Inactive">

                                Inactive

                            </option>

                        </select>

                    </div>

                </div>

                <hr>
                                <div class="text-end">

                    <!-- Cancel -->

                    <button type="button" class="btn btn-secondary me-2" onclick="confirmVendorCancel('{{ url_for('vendor.list_vendors') }}')">
                        <i class="bi bi-x-circle"></i> Cancel </button>

                    <!-- Save -->

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Save Vendor

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
