{% extends "base.html" %}
{% block title %}Edit employee — VERA ERP{% endblock %}
{% block page_title %}Employees{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Edit employee</h1>
    <p>Update name or email.</p>
  </div>
</div>
<div class="form-card">
  <form method="POST" action="{{ url_for('employee.update') }}">
    <input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">
    <input type="hidden" name="id" value="{{ employee.id }}">
    <div class="mb-3">
      <label class="form-label" for="emp-name">Name</label>
      <input id="emp-name" type="text" name="name" class="form-control" value="{{ employee.name }}" required minlength="3">
    </div>
    <div class="mb-3">
      <label class="form-label" for="emp-email">Email</label>
      <input id="emp-email" type="email" name="email" class="form-control" value="{{ employee.email }}" required autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{{ url_for('employee.index') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
