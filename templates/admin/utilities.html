{% extends "base.html" %}
{% from "_macros.html" import csrf_input %}
{% block title %}Admin — VERA ERP{% endblock %}
{% block page_title %}Admin{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Admin utilities</h1>
    <p>Destructive actions. These cannot be undone.</p>
  </div>
</div>

<div class="page-card" style="max-width:560px">
  <div class="card-body d-flex flex-wrap gap-2">
    <form method="post" action="{{ url_for('admin.clear_transactions') }}" onsubmit="return confirm('Clear all transaction data? This cannot be undone.')">
      {{ csrf_input() }}
      <button type="submit" class="btn btn-warning">Clear transactions</button>
    </form>
    <form method="post" action="{{ url_for('admin.reset_database') }}" onsubmit="return confirm('Reset the entire database? All records will be deleted.')">
      {{ csrf_input() }}
      <button type="submit" class="btn btn-danger">Reset database</button>
    </form>
  </div>
</div>
{% endblock %}
