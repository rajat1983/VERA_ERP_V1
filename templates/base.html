<script>
   // for Validation
  (() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
function openEditModal(id, name, email) {
  document.getElementById("edit-id").value = id;
  document.getElementById("edit-name").value = name;
  document.getElementById("edit-email").value = email;

  const modal = new bootstrap.Modal(document.getElementById("editModal"));
  modal.show();
}

</script>

  <div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>
  {% block content %}{% endblock %}
  <script>
function autoSearch() {
  const q = document.getElementById("searchBox").value;

  fetch(`/auto-search?q=${encodeURIComponent(q)}`)
    .then(res => res.json())
    .then(data => {
      let rows = "";

      data.forEach(emp => {
        rows += `
          <tr>
            <td>${emp.id}</td>
            <td>${emp.name}</td>
            <td>${emp.email}</td>
            <td>
              <a href="/edit/${emp.id}" class="btn btn-sm btn-warning">Edit</a>
              <a href="/delete/${emp.id}" class="btn btn-sm btn-danger">Delete</a>
            </td>
          </tr>
        `;
      });

      document.getElementById("employeeTable").innerHTML = rows;
    })
    .catch(err => console.error(err));
}
