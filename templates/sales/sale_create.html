{% extends "base.html" %}
{% block content %}

<h3>Create Sale</h3>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">

<label>Customer<span class="text-danger">*</span></label>

<select   name="customer_id"    class="form-select"    required>
    <option value="">-- Select Customer --</option>

    {% for c in customers %}
        <option value="{{ c.id }}"> {{ c.name }} </option>
    {% endfor %}
</select>

<label class="form-label">   Sale Date <span class="text-danger">*</span></label>
<input     type="date"  id="sale_date"  name="sale_date"  class="form-control" value="{{ today }}"  required>
<h5 class="mt-3">Items</h5>
<button  type="button"  id="btnAddItem"  class="btn btn-secondary mb-2">   + Add Item</button>
<table class="table table-bordered align-middle" id="items">

    <thead class="table-light">

        <tr>

            <th width="45%">Product</th>

            <th width="10%">Qty</th>

            <th width="15%">Price</th>

            <th width="15%">Amount</th>

            <th width="10%">Info</th>

            <th width="5%"></th>

        </tr>

    </thead>

    <tbody>

        <tr>
            <td>

                <select
                    name="product_id[]"
                    class="form-select">

                    <option value="">-- Select Product --</option>

                    {% for p in products %}
                    <option
                        value="{{ p.id }}"
                        data-stock="{{ p.stock_qty }}"
                        data-pprice="{{ p.cost_price }}"
                        data-sprice="{{ p.selling_price }}"
                        data-tax="{{ p.tax_rate }}">

                        {{ p.name }}

                    </option>
                    {% endfor %}

                </select>

            </td>

            <td>

                <input
                    type="number"
                    name="qty[]"
                    class="form-control qty"
                    min="1"
                    value="1">

            </td>

            <td>

                <input
                    type="number"
                    name="price[]"
                    class="form-control price"
                    step="0.01"
                    min="0"
                    value="0.00">

            </td>

            <td>

                <input
                    type="number"
                    name="amount[]"
                    class="form-control amount"
                    readonly
                    value="0.00">

            </td>

            <td class="text-center">

                <i
                    class="bi bi-info-circle-fill text-primary product-info-icon"
                    style="display:none;cursor:pointer;font-size:20px;">
                </i>

            </td>

            <td class="text-center">

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="removeRow(this)">

                    <i class="bi bi-trash"></i>

                </button>

            </td>

        </tr>

    </tbody>

</table>
<div class="row mt-4">

    <div class="col-md-7">
       <div class="mb-3">

            <label class="form-label">
                Discount (%)
            </label>

            <input
                type="number"
                id="discount_input"
                name="discount"
                class="form-control"
                value="0"
                min="0"
                max="100"
                step="0.01">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Remarks
            </label>

            <textarea
                name="remarks"
                class="form-control"
                rows="3"></textarea>

        </div>

    </div>

    <div class="col-md-5">

        <table class="table table-bordered">

            <tr>
                <th>Subtotal</th>
                <td class="text-end">
                    ₹ <span id="subtotal">0.00</span>
                </td>
            </tr>

            <tr>
                <th>Discount</th>
                <td class="text-end">
                    ₹ <span id="discount">0.00</span>
                </td>
            </tr>

            <tr>
                <th>GST</th>
                <td class="text-end">
                    ₹ <span id="gst_total">0.00</span>
                </td>
            </tr>

            <tr class="table-primary">

                <th>Grand Total</th>

                <th class="text-end">

                    ₹ <span id="grand_total">0.00</span>

                </th>

            </tr>

        </table>

    </div>

</div>

<button class="btn btn-success">Save</button>
<a href="/sales"
   class="btn btn-secondary"
   id="btnCancelSale">
    Cancel
</a>

</form>


<script src="{{ url_for('static', filename='js/sales.js') }}"></script>
{% endblock %}
