{% extends "base.html" %}
{% block content %}

<h3>Create Sale</h3>
<form method="POST">
<label>Customer</label>
<select name="customer_id" class="form-control">
  {% for c in customers %}
  <option value="{{ c.id }}">{{ c.name }}</option>
  {% endfor %}
</select>

<label>Date</label>
<input type="date" id="sale_date" name="sale_date" class="form-control" required>
<h5 class="mt-3">Items</h5>
<table class="table" id="items">
<thead>
<tr>
  <th>Product</th>
  <th>Qty</th>
  <th>Price</th>
  <th></th>
</tr>
</thead>
<tbody>
<tr>
<td>
<select name="product_id[]" class="form-control">
  {% for p in products %}
  <option value="{{ p.id }}">{{ p.name }}</option>
  {% endfor %}
</select>
</td>
<td><input name="qty[]" type="number" value="1" class="form-control"></td>
<td><input name="price[]" type="number" step="0.01" class="form-control"></td>
<td><button type="button" onclick="removeRow(this)" class="btn btn-danger">X</button></td>
</tr>
</tbody>
</table>

<button type="button" onclick="addRow()" class="btn btn-secondary">+ Add Item</button>
<br><br>
<label>Remarks</label>
<input type="text" name="remarks" class="form-control" value="NA">
<label>Discount</label>
<input type="text" name="discount" class="form-control" value="0">
<br>
<button class="btn btn-success">Save</button>
<a href="/sales" class="btn btn-secondary" >Cancel</a>

</form>

<script>
function addRow(){
  let row = document.querySelector("#items tbody tr").cloneNode(true);
  document.querySelector("#items tbody").appendChild(row);
}
function removeRow(btn){
  btn.closest("tr").remove();
}
</script>

{% endblock %}
