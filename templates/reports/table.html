{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h4>{{ title }}</h4>
  <a href="{{ url_for('report.index') }}" class="btn btn-secondary">Back</a>
</div>
<form class="row g-2 mb-3">
  <div class="col-md-3"><input type="date" name="from_date" class="form-control" value="{{ from_date }}"></div>
  <div class="col-md-3"><input type="date" name="to_date" class="form-control" value="{{ to_date }}"></div>
  <div class="col-md-2"><button class="btn btn-primary">Filter</button></div>
</form>
<div class="table-responsive">
<table class="table table-bordered table-striped">
  <thead class="table-light"><tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr></thead>
  <tbody>
    {% for row in rows %}
    <tr>{% for k in keys %}<td>{{ row[k] }}</td>{% endfor %}</tr>
    {% else %}
    <tr><td colspan="{{ headers|length }}" class="text-center">No data</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
