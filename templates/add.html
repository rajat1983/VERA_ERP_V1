{% extends "base.html" %}
{% block title %}Add employee — VERA ERP{% endblock %}
{% block page_title %}Employees{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Add employee</h1>
    <p>Name and email are required.</p>
  </div>
</div>
<div class="form-card">
  <form method="POST" action="{{ url_for('employee.create') }}">
    <input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="emp-name">Name</label>
      <input id="emp-name" type="text" name="name" class="form-control" required minlength="3">
    </div>
    <div class="mb-3">
      <label class="form-label" for="emp-email">Email</label>
      <input id="emp-email" type="email" name="email" class="form-control" required autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('employee.index') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
