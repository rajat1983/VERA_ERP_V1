{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Update Product</h5>
                </div>

                <div class="card-body">
<form method="POST">
      <div class="mb-3">
        <label>Vendor</label>        
      <select name="vendor_id" class="form-control" required>
  <option value="">Select Vendor</option>

  {% for v in vendors %}
    <option value="{{ v.id }}"
      {% if v.id == product.vendor_id %} selected {% endif %}>
      {{ v.name }}
    </option>
  {% endfor %}
</select>
        <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" value="{{ product.name }}" required minlength="3">
      </div>
      <div class="mb-3">
        <label class="form-label">SKU</label>
          <input class="form-control mb-2" name="sku" value="{{ product.sku }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Purchase Price</label>
          <input class="form-control mb-2" name="cost_price" value="{{ product.cost_price }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Saleing Price</label>
          <input class="form-control mb-2" name="selling_price" value="{{ product.selling_price }}" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Stock</label>
          <input class="form-control mb-2" name="stock_qty" value="{{ product.stock_qty }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Reorder Level</label>
          <input class="form-control mb-2" name="reorder_level" value="{{ product.reorder_level }}" >
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
</select>
          
      </div>

      <div class="d-flex justify-content-between">
                           <a href="/products" class="btn btn-secondary" >Cancel</a>
                           <button type="submit" class="btn btn-success">Update</button>
                        </div>



</form>
</div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
