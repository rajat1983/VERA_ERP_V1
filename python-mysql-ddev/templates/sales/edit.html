{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Update Sale</h5>
                </div>

                <div class="card-body">
<form method="post" action="/sales/{{ sale.id }}/update">


<div class="mb-3">
        <label class="form-label">Invoice No : <b>{{ sale.invoice_no }}</b></label>
          
      </div>
<div class="mb-3">
     <label>Customer</label>        
      <select name="customer_id" class="form-control" required>
        {% for c in customers %}
        <option value="{{ c.id }}" {% if c.id==sale.customer_id %}selected{% endif %}>
        {{ c.name }}
        </option>
        {% endfor %}
        </select>
</div>
<div class="mb-3">
        <label class="form-label">Discount</label>
          <input class="form-control mb-2" name="discount" value="{{ sale.discount }}" required>
      </div>

<h5 class="mt-3">Items</h5>
<table class="table" id="items">
<thead>
<tr>
  <th>Product</th>
  <th>Qty</th>
  <th>Price</th>
  <th></th>
</tr>
</thead>
{% for it in items %}
<tr>
<td>
<select name="product_id[]" class="form-control">
{% for p in products %}
<option value="{{ p.id }}" {% if p.id==it.product_id %}selected{% endif %}>
{{ p.name }}
</option>
{% endfor %}
</select>
</td>
<td><input name="qty[]" value="{{ it.qty }}" class="form-control"></td>
<td><input name="price[]" value="{{ it.price }}" class="form-control"></td>
</tr>
{% endfor %}
</table>
<div class="d-flex justify-content-between">
    <a href="/sales" class="btn btn-secondary" >Cancel</a>
    <button type="submit" class="btn btn-success">Update</button>
</div>

</form>

 

</form>
</div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
