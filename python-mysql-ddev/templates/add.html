{% extends "base.html" %}

{% block content %}
<h3>Add Employee</h3>

<form method="POST" action="{{ url_for('employee.create') }}">
  
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input
      type="text"
      name="name"
      class="form-control"
      required
    >
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input
      type="email"
      name="email"
      class="form-control"
      required
    >
  </div>

  <button type="submit" class="btn btn-success">
    Save
  </button>

  <a href="{{ url_for('employee.index') }}" class="btn btn-secondary">
    Cancel
  </a>

</form>
{% endblock %}
