<!DOCTYPE html>
<html>
<head>
    <title>GenAI Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3 class="text-center">🤖 GenAI Chat</h3>

    <div id="chatBox" class="border rounded p-3 mb-3 bg-white" style="height: 400px; overflow-y: auto;"></div>

    <div class="input-group">
        <input type="text" id="userInput" class="form-control" placeholder="Ask something...">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="{{ url_for('ai.static', filename='ai.js') }}"></script>
</body>
</html>
